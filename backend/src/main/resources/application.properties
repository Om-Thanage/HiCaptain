spring.application.name=Backend

# MongoDB Configuration
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/hicaptain}
spring.data.mongodb.database=${MONGODB_DATABASE:hicaptain}
spring.data.mongodb.auto-index-creation=true

# Security - JWT
security.jwt.secret=${JWT_SECRET}

# GitHub Integration
github.token=${GITHUB_TOKEN:}
github.api.base-url=${GITHUB_API_BASE_URL:https://api.github.com}
provider.token-key=${PROVIDER_TOKEN_ENCRYPTION_KEY:${GOOGLE_TOKEN_ENCRYPTION_KEY:}}

# GitHub OAuth App Configuration
github.oauth.client-id=${GITHUB_OAUTH_CLIENT_ID:}
github.oauth.client-secret=${GITHUB_OAUTH_CLIENT_SECRET:}
github.oauth.redirect-uri=${GITHUB_OAUTH_REDIRECT_URI:${BACKEND_URL:http://localhost:8080}/api/auth/github/callback}
github.oauth.scopes=${GITHUB_OAUTH_SCOPES:repo,read:user,user:email,admin:repo_hook}

# Social sign-in uses the same GitHub OAuth app and callback as repository access.
auth.github.client-id=${github.oauth.client-id}
auth.github.client-secret=${github.oauth.client-secret}
auth.github.redirect-uri=${github.oauth.redirect-uri}
auth.google.redirect-uri=${GOOGLE_LOGIN_REDIRECT_URI:${BACKEND_URL:http://localhost:8080}/auth/oauth/google/callback}

# Google Calendar Integration
google.workspace.client-id=${GOOGLE_CLIENT_ID:}
google.workspace.client-secret=${GOOGLE_CLIENT_SECRET:}
google.workspace.token-key=${GOOGLE_TOKEN_ENCRYPTION_KEY:}
google.workspace.redirect-uri=${GOOGLE_OAUTH_REDIRECT_URI:${BACKEND_URL:http://localhost:8080}/api/google-calendar/auth/callback}

# Server Configuration
server.port=${SERVER_PORT:8080}

# Invitation email (configure these in the deployment environment)
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
app.mail.from=${SMTP_FROM:}
app.frontend-url=${FRONTEND_URL:http://localhost:3000}

# Logging
logging.level.com.HiCaptain=DEBUG
logging.level.org.springframework.security=DEBUG

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.show-actuator=false
