services:
  mongodb:
    image: mongo:7.0
    container_name: hicaptain-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Set a strong MongoDB root password}
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE:-hicaptain}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:-hicaptain}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Set a separate application database password}
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/10-app-user.js:ro
    networks:
      - hicaptain-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: hicaptain-backend
    restart: unless-stopped
    ports:
      - "8081:8080"  # Changed to 8081 externally, 8080 internally
    environment:
    # Spring Boot configuration
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
    
    # MongoDB connection
      SPRING_DATA_MONGODB_URI:  mongodb://${MONGO_APP_USERNAME:-hicaptain}:${MONGO_APP_PASSWORD:?Set a separate application database password}@mongodb:27017/${MONGODB_DATABASE:-hicaptain}?authSource=${MONGODB_DATABASE:-hicaptain}
    
    # JWT Secret
      MONGODB_DATABASE: ${MONGODB_DATABASE:-hicaptain}
      JWT_SECRET: ${JWT_SECRET:?Set a strong JWT signing secret}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}

    # Public callback origin must match the OAuth provider's registered URLs.
      BACKEND_URL: ${BACKEND_URL:-http://localhost:8081}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
    
    # Google Workspace Integration
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_TOKEN_ENCRYPTION_KEY: ${GOOGLE_TOKEN_ENCRYPTION_KEY:-}
      PROVIDER_TOKEN_ENCRYPTION_KEY: ${PROVIDER_TOKEN_ENCRYPTION_KEY:-${GOOGLE_TOKEN_ENCRYPTION_KEY:-}}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}

    # Application settings
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}

    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - hicaptain-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local

networks:
  hicaptain-network:
    driver: bridge
