name: Application checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=moderate
  backend:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
    env:
      MONGODB_URI: mongodb://localhost:27017/hicaptain_automated_tests
      MONGODB_DATABASE: hicaptain_automated_tests
      JWT_SECRET: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: bash ./mvnw --batch-mode test
      - run: python docker/test-compose.py

  agent-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: agent-worker/requirements.lock
      - run: pip install -r requirements.lock
      - run: python -m unittest -v
      - run: pip install pip-audit==2.10.1
      - run: pip-audit --disable-pip --no-deps -r requirements.lock --vulnerability-service pypi
