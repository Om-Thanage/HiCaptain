<!DOCTYPE html>
<html>
<head>
    <title>Backend Test</title>
</head>
<body>
    <h1>Backend Connection Test</h1>
    <div id="results"></div>
    
    <script>
        async function testBackend() {
            const results = document.getElementById('results');
            
            // Test 1: Check if backend is running
            try {
                console.log('Testing backend connection...');
                const response = await fetch('http://localhost:8080/health', { 
                    method: 'GET',
                    mode: 'cors'
                });
                results.innerHTML += `<p>✅ Backend is running (Status: ${response.status})</p>`;
            } catch (error) {
                results.innerHTML += `<p>❌ Backend connection failed: ${error.message}</p>`;
                return;
            }
            
            // Test 2: Check authentication
            const token = localStorage.getItem('token');
            if (!token) {
                results.innerHTML += `<p>❌ No token found in localStorage</p>`;
                return;
            }
            
            results.innerHTML += `<p>✅ Token exists: ${token.substring(0, 20)}...</p>`;
            
            // Test 3: Test GitHub status endpoint
            try {
                const response = await fetch('http://localhost:8080/api/auth/github/status', {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                results.innerHTML += `<p>GitHub status: ${response.status} - ${response.ok ? '✅' : '❌'}</p>`;
                if (!response.ok) {
                    const errorText = await response.text();
                    results.innerHTML += `<p>Error: ${errorText}</p>`;
                }
            } catch (error) {
                results.innerHTML += `<p>❌ GitHub test failed: ${error.message}</p>`;
            }
            
            // Test 4: Test Google Calendar status endpoint
            try {
                const response = await fetch('http://localhost:8080/api/google-calendar/auth/status?userId=test-user', {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                results.innerHTML += `<p>Google Calendar status: ${response.status} - ${response.ok ? '✅' : '❌'}</p>`;
                if (!response.ok) {
                    const errorText = await response.text();
                    results.innerHTML += `<p>Error: ${errorText}</p>`;
                }
            } catch (error) {
                results.innerHTML += `<p>❌ Google Calendar test failed: ${error.message}</p>`;
            }
        }
        
        // Run tests when page loads
        testBackend();
    </script>
</body>
</html>
